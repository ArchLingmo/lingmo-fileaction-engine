name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this version (e.g. 1.0.0); leave empty for a normal build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          RELEASE: ${{ github.event.inputs.release }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A push to main whose commit message starts with "Release v1.2.3" publishes that version,
          # as does a v1.2.3 tag or a manual run with a version.
          release="${RELEASE#v}"
          first_line="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)"
          if [ -z "$release" ] && [ "$GITHUB_REF" = refs/heads/main ] && [[ "$first_line" =~ ^Release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            release="${BASH_REMATCH[1]}"
          fi
          if [ -z "$release" ] && [ "$GITHUB_REF_TYPE" = tag ]; then release="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$release" ]; then
            echo "version=$release" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  core-tests-linux:
    name: Core tests (Linux, with ffmpeg/pandoc/LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pandoc libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Test
        run: dotnet test tests/FileAction.Tests -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows build, tests and installer
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download ffmpeg and pandoc (for the tests; the app downloads them on demand)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-tools.ps1 -Destination tools

      - name: Test (Windows)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\tools;$env:PATH"
          dotnet test tests/FileAction.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/FileAction.App/FileAction.App.csproj -c Release -r win-x64 --self-contained -p:Version=$env:VERSION -o publish
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/

      - name: UI self-test
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'self-test'
          $p = Start-Process -FilePath "$PWD\publish\FileAction.exe" -ArgumentList '--self-test', "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out 'self-test.txt')
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Measure size and idle resource use
        shell: pwsh
        run: |
          function Size($path) { (Get-ChildItem $path -Recurse -File | Measure-Object Length -Sum).Sum / 1MB }
          "Publish folder (app + trimmed .NET runtime): {0:N1} MB" -f (Size publish)
          Get-ChildItem publish -File | Sort-Object Length -Descending | Select-Object -First 8 | ForEach-Object { "  {0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

          # Start like after sign-in (no first-run window) and sample memory and CPU while idle.
          New-Item -ItemType Directory -Force "$env:APPDATA\FileAction" | Out-Null
          '{ "FirstRunDone": true, "CheckForUpdates": false }' | Set-Content "$env:APPDATA\FileAction\settings.json"
          $p = Start-Process -FilePath "$PWD\publish\FileAction.exe" -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh(); $cpu1 = $p.TotalProcessorTime
          Start-Sleep -Seconds 30
          $p.Refresh()
          "Idle after 45 s: working set {0:N1} MB, private {1:N1} MB, CPU while idle {2:N2} s in 30 s" -f ($p.WorkingSet64 / 1MB), ($p.PrivateMemorySize64 / 1MB), ($p.TotalProcessorTime - $cpu1).TotalSeconds
          Stop-Process -Id $p.Id -Force
          Remove-Item "$env:APPDATA\FileAction" -Recurse -Force

      - name: Installer and zip
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" installer/FileAction.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path publish/* -DestinationPath "artifacts/FileAction-$env:VERSION-win-x64.zip"
          Get-ChildItem artifacts | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $setup = Get-Item "artifacts/FileAction-Setup-$env:VERSION.exe"
          if ($setup.Length -gt 50MB) { throw ("The installer grew to {0:N1} MB (limit 50 MB)" -f ($setup.Length / 1MB)) }

      - uses: actions/upload-artifact@v4
        with:
          name: FileAction-windows
          path: artifacts/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: self-test

  linux:
    name: Linux build and package
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/FileAction.Linux/FileAction.Linux.csproj -c Release -r linux-x64 --self-contained -p:Version=$VERSION -o publish-linux
      - name: Self-test and command line
        run: |
          ./publish-linux/fileaction --version
          ./publish-linux/fileaction --self-test self-test-linux
          cat self-test-linux/self-test.txt
          cp self-test-linux/en/wheel-actions.png /tmp/sample.png
          ./publish-linux/fileaction list /tmp/sample.png
          ./publish-linux/fileaction run image.to.jpg /tmp/sample.png
          test -s /tmp/sample.jpg
      - name: Package
        run: |
          packaging/make-linux-package.sh "$VERSION" publish-linux dist
          ls -la dist
          du -sh publish-linux
          size=$(stat -c %s dist/*.tar.xz)
          if [ "$size" -gt $((50 * 1024 * 1024)) ]; then echo "The tarball grew to $((size / 1048576)) MB (limit 50 MB)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: FileAction-linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews-linux
          path: self-test-linux

  arch:
    name: Arch Linux package (makepkg, install, run)
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FileAction-linux
          path: dist
      - name: Build and install with makepkg
        run: |
          pacman -Syu --noconfirm --needed base-devel
          useradd -m builder
          mkdir -p /build
          cp dist/*.tar.xz /build/
          tarball="$(basename dist/*.tar.xz)"
          # Same PKGBUILD as on the AUR, but taking the tarball from this run instead of the release.
          sed "s|^source=.*|source=(\"$tarball\")|" dist/PKGBUILD > /build/PKGBUILD
          chown -R builder /build
          (source /build/PKGBUILD && pacman -S --noconfirm --needed "${depends[@]}")
          su builder -c "cd /build && makepkg --noconfirm"
          pacman -U --noconfirm /build/fileaction-bin-*.pkg.tar.zst
      - name: Run the installed app
        run: |
          fileaction --version
          test -f /usr/share/applications/fileaction.desktop
          test -f /usr/share/kio/servicemenus/fileaction.desktop
          su builder -c "fileaction --self-test /tmp/arch-self-test" && cat /tmp/arch-self-test/self-test.txt
          su builder -c "cp /tmp/arch-self-test/en/wheel-image-convert.png /tmp/sample.png && fileaction run image.to.webp /tmp/sample.png && test -s /tmp/sample.webp"
      - name: AUR metadata
        run: |
          mkdir -p aur
          cp dist/PKGBUILD aur/
          chown -R builder aur
          su builder -c "cd aur && makepkg --printsrcinfo > .SRCINFO"
          cat aur/PKGBUILD aur/.SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: aur
          include-hidden-files: true

  release:
    name: Publish release
    needs: [version, windows, linux, arch]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FileAction-windows
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: FileAction-linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: aur
      - name: Replace an existing release of this version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # GitHub keeps the original author when a release is updated, so a re-release deletes it first.
          if [ -z "$GH_TOKEN" ]; then echo "No RELEASE_TOKEN secret: publishing as github-actions."; exit 0; fi
          echo "Publishing as $(gh api user -q .login)"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "v$VERSION" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "Deleted the existing release v$VERSION"
          fi
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # With a RELEASE_TOKEN secret (a personal access token) the release is published under that
          # person's account; otherwise under github-actions.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FileAction ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/*
            linux/*.tar.xz
            linux/PKGBUILD
      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # Needs an AUR account whose SSH public key matches the AUR_SSH_PRIVATE_KEY secret.
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then echo "No AUR_SSH_PRIVATE_KEY secret: skipping the AUR."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/fileaction-bin.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR is already up to date."; exit 0; fi
          git -c user.name="${{ github.repository_owner }}" -c user.email="${{ github.repository_owner }}@users.noreply.github.com" \
            commit -m "Update to $VERSION"
          git push origin HEAD:master
